name: Feature request
description: Something Apinx should do that it does not do yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How you picture it working. A policy, a console screen, a setting, an example in YAML.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you work around it today
      description: Another gateway, a script, nothing at all.
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - On premises
        - Apinx Cloud
        - Both
